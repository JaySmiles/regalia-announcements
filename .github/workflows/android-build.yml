name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: regalia-announcements/package-lock.json

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Install Web Dependencies
      run: |
        cd regalia-announcements
        npm install

    - name: Compile Production Web Assets
      run: |
        cd regalia-announcements
        npm run build

    - name: Synchronize Capacitor Android Wrapper
      run: |
        cd regalia-announcements
        npx cap sync android

    - name: Compile Release Android App (APK)
      run: |
        cd regalia-announcements/android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: regalia-announcements-release-apk
        path: regalia-announcements/android/app/build/outputs/apk/release/app-release-unsigned.apk
