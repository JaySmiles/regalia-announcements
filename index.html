<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Regalia Announcements - Stay up to date with live announcements from Regalia Church." />
    <meta name="theme-color" content="#6750A4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Regalia Announcements</title>
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="h-full overflow-hidden">
    
    <!-- Premium Video Splash Screen Overlay -->
    <div id="video-splash" class="fixed inset-0 bg-[#141218] z-50 flex flex-col justify-center items-center overflow-hidden">
      <!-- Skip button overlay -->
      <button id="skip-splash-btn" class="absolute top-12 right-6 bg-black/50 text-[#E6E1E5] border border-white/20 rounded-full px-5 py-2 text-sm font-medium backdrop-blur-md active:scale-95 transition-transform z-50 pointer-events-auto">
        Skip
      </button>

      <!-- Video element (loads splash.mp4) -->
      <video id="splash-video" class="absolute inset-0 w-full h-full object-cover" style="visibility:hidden;" playsinline muted>
        <source src="/assets/splash.mp4" type="video/mp4" />
      </video>

      <!-- Fallback / Initial Loading UI -->
      <div id="splash-fallback" class="flex flex-col items-center gap-6 p-6 transition-all duration-300 z-10">
        <div class="h-20 flex items-center justify-center">
          <img src="/assets/logo.png" alt="Regalia Church Logo" class="h-16 w-auto object-contain transition duration-300" />
        </div>
        <h1 class="text-[#E6E1E5] text-2xl font-bold tracking-tight">Regalia Announcements</h1>
        <!-- Material You loading progress bar -->
        <div class="w-48 h-1 bg-white/10 rounded-full overflow-hidden mt-2">
          <div class="h-full bg-[#D0BCFF] w-1/3 rounded-full animate-[shimmer_1.5s_infinite]" style="animation: loading-bar 1.5s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>

    <!-- Main Application Wrapper -->
    <div id="app" class="flex flex-col h-full overflow-hidden select-none">
      
      <!-- Premium Branded Header -->
      <header class="pt-safe flex-none bg-[#F7F2FA] dark:bg-[#141218] border-b border-m3-light-surfaceVariant/30 dark:border-m3-dark-surfaceVariant/30 px-6 py-4 flex items-center justify-between transition-colors duration-300 z-20 shadow-sm">
        <div class="flex items-center gap-3">
          <div class="h-10 flex items-center">
            <!-- Dynamic logo that inverts base colors perfectly in light mode -->
            <img src="/assets/logo.png" alt="Regalia Logo" class="logo-img invert dark:invert-0 transition duration-300 h-9 w-auto object-contain" />
          </div>
          <span class="text-base font-bold tracking-normal text-m3-light-onSurface dark:text-m3-dark-onSurface">
            Announcements
          </span>
        </div>
        
        <!-- Light / Dark Mode Toggle Button -->
        <button id="theme-toggle" class="p-2.5 rounded-full bg-m3-light-primaryContainer/30 dark:bg-m3-dark-primaryContainer/30 text-m3-light-primary dark:text-m3-dark-primary hover:scale-105 active:scale-95 transition-all duration-200" aria-label="Toggle Theme Mode">
          <!-- Sun Icon (shown in dark mode) -->
          <svg id="sun-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path>
          </svg>
          <!-- Moon Icon (shown in light mode) -->
          <svg id="moon-icon" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>
      </header>

      <!-- Offline / Fail Resilience Banner -->
      <div id="offline-banner" class="flex-none hidden bg-m3-light-errorContainer dark:bg-m3-dark-errorContainer text-m3-light-onErrorContainer dark:text-m3-dark-onErrorContainer px-6 py-2.5 text-center text-xs font-semibold transition-colors duration-300 flex items-center justify-center gap-2">
        <svg class="w-4 h-4 animate-pulse" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <span>Offline: Displaying cached announcements.</span>
        <button id="retry-btn" class="ml-2 underline font-bold hover:opacity-85 active:scale-95 transition-transform">Retry</button>
      </div>

      <!-- Connection Status -->
      <div class="flex-none bg-[#F7F2FA] dark:bg-[#141218] px-6 pt-3 transition-colors duration-300">
        <div class="max-w-sm mx-auto flex items-center justify-between gap-3 text-[11px] font-semibold text-m3-light-onSurfaceVariant/70 dark:text-m3-dark-onSurfaceVariant/70">
          <div class="flex items-center gap-2 min-w-0">
            <span id="connection-dot" class="h-2.5 w-2.5 flex-none rounded-full bg-m3-light-outline dark:bg-m3-dark-outline transition-colors duration-300"></span>
            <span id="connection-status" class="truncate">Checking connection</span>
          </div>
          <span id="last-refreshed" class="flex-none text-right">Not refreshed yet</span>
        </div>
      </div>

      <!-- Segmented Control (Tabs) -->
      <div class="flex-none bg-[#F7F2FA] dark:bg-[#141218] px-6 py-3 transition-colors duration-300 z-10 shadow-[0_1px_0_rgba(0,0,0,0.03)] flex justify-center">
        <div class="inline-flex p-1 bg-m3-light-surfaceVariant/40 dark:bg-m3-dark-surfaceVariant/40 rounded-full w-full max-w-sm">
          <button id="tab-current" class="flex-1 text-center py-2.5 rounded-full text-sm font-semibold transition-all duration-300 bg-m3-light-primaryContainer dark:bg-m3-dark-primaryContainer text-m3-light-onPrimaryContainer dark:text-m3-dark-onPrimaryContainer shadow-sm">
            Current
          </button>
          <button id="tab-past" class="flex-1 text-center py-2.5 rounded-full text-sm font-semibold transition-all duration-300 text-m3-light-onSurfaceVariant dark:text-m3-dark-onSurfaceVariant hover:opacity-80">
            Past
          </button>
        </div>
      </div>

      <!-- Scrollable Feed Container -->
      <div id="scroll-wrapper" class="flex-1 momentum-scroll bg-[#F7F2FA] dark:bg-[#141218] relative transition-colors duration-300">
        
        <!-- Pull-to-Refresh Indicator -->
        <div id="pull-indicator-container" class="flex justify-center items-center w-full">
          <div id="pull-indicator" class="flex justify-center items-center py-3">
            <svg class="material-spinner w-8 h-8" viewBox="25 25 50 50">
              <circle class="material-spinner-circle" cx="50" cy="50" r="20" fill="none" stroke-width="4" stroke-miterlimit="10"/>
            </svg>
          </div>
        </div>

        <!-- Real announcements render list -->
        <main id="announcements-feed" class="px-6 py-4 flex flex-col gap-4 max-w-md mx-auto min-h-[calc(100%-10px)] pb-24">
          <!-- Announcements dynamically render here -->
        </main>
      </div>

      <!-- Safe Area Bottom Navigation Spacer -->
      <footer class="flex-none pb-safe bg-[#F7F2FA] dark:bg-[#141218] transition-colors duration-300 border-t border-m3-light-surfaceVariant/20 dark:border-m3-dark-surfaceVariant/20 flex justify-center items-center py-3">
        <p class="text-[10px] tracking-widest uppercase font-semibold text-m3-light-onSurfaceVariant/50 dark:text-m3-dark-onSurfaceVariant/50">
          Regalia Announcements • Cohesive & Connected
        </p>
      </footer>

    </div>

    <!-- Loading Bar Shimmer Animation -->
    <style>
      @keyframes loading-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
    </style>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
